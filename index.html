<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit & Veg Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #e9eee6;
    --ink: #1f2a22;
    --muted: #66746a;
    --fruit: #b3323f;
    --fruit-soft: #f8e4e4;
    --veg: #2c6a3d;
    --veg-soft: #dcecdc;
    --line: #c9d3c8;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Hind', 'Noto Sans Devanagari', system-ui, sans-serif;
    background: var(--ground);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px 6px;
  }
  header h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.3px;
  }
  .ghost {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .ghost:focus-visible, button:focus-visible, textarea:focus-visible { outline: 3px solid #1f2a22; outline-offset: 2px; }

  /* ---------- SPLIT BOARD ---------- */
  .board {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 6px 10px 10px;
  }
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--white);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 12px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 17px;
  }
  .panel-head small { font-family: 'Hind', sans-serif; font-weight: 500; font-size: 12px; opacity: .75; }
  #panelLeft  .panel-head { background: var(--fruit); color: #fff; }
  #panelRight .panel-head { background: var(--veg);   color: #fff; }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    -webkit-overflow-scrolling: touch;
  }
  .panel-body:empty::before {
    content: attr(data-empty);
    color: var(--muted);
    font-size: 14px;
  }
  .panel.live .panel-body::after {
    content: '';
    display: inline-block;
    width: 8px; height: 16px;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: currentColor;
    animation: blink 0.9s steps(2) infinite;
  }
  #panelLeft.live  .panel-body::after { color: var(--fruit); }
  #panelRight.live .panel-body::after { color: var(--veg); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .panel.live .panel-body::after { animation: none; } }

  .err {
    margin: 0 10px 6px;
    padding: 8px 12px;
    border-radius: 10px;
    background: #fde8e8;
    color: #8a1f1f;
    font-size: 14px;
    display: none;
  }

  /* ---------- CHECKLIST ---------- */
  #panelLeft  { --accent: var(--fruit); }
  #panelRight { --accent: var(--veg); }
  .panel-body { white-space: normal; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 2px; cursor: pointer; border-bottom: 1px solid #eef1ec; }
  .item input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
  .item span { transition: color .15s; }
  .item.done span { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--accent); color: var(--muted); }
  .plain { margin: 4px 0; }
  .status {
    align-self: center;
    margin: 0 10px 6px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--ink);
    color: #fff;
    display: none;
  }
  .status.warn { background: #8a5a12; }
  @media (max-width: 480px) { .item { gap: 7px; padding: 6px 0; } .item input { width: 18px; height: 18px; } }

  /* ---------- INPUT BAR ---------- */
  .composer { padding: 0 10px 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink);
    cursor: pointer;
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1;
    font: inherit;
    font-size: 16px;
    resize: none;
    max-height: 110px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--white);
    color: var(--ink);
  }
  #sendBtn {
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 11px 18px;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  #sendBtn.stop { background: var(--fruit); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 480px) {
    .board { gap: 6px; padding: 4px 6px 8px; }
    .panel-body { padding: 8px; font-size: 13.5px; }
    .panel-head { padding: 8px; font-size: 15px; }
    .panel-head small { display: none; }
  }
  @media (min-width: 1000px) {
    body { max-width: 1200px; margin: 0 auto; }
    .panel-body { font-size: 16px; padding: 18px; }
  }
</style>
</head>
<body>

<header>
  <h1>Fruit &amp; Veg Board</h1>
  <button class="ghost" id="clearBtn" type="button">Clear</button>
</header>

<main class="board">
  <section class="panel" id="panelLeft" aria-label="Left panel: Fruits">
    <div class="panel-head">Fruits <small>Left</small></div>
    <div class="panel-body" id="bodyLeft" data-empty="Fruits yahan aayenge"></div>
  </section>
  <section class="panel" id="panelRight" aria-label="Right panel: Vegetables">
    <div class="panel-head">Vegetables <small>Right</small></div>
    <div class="panel-body" id="bodyRight" data-empty="Vegetables yahan aayenge"></div>
  </section>
</main>

<div class="err" id="errBox" role="alert"></div>
<div class="status" id="status" role="status"></div>

<div class="composer">
  <div class="chips">
    <button class="chip" type="button">10 fruits ke naam batao</button>
    <button class="chip" type="button">10 vegetables ke naam batao</button>
    <button class="chip" type="button">Fruit left mein aur vegetables right mein likho</button>
    <button class="chip" type="button">Vegetables left mein, fruits right mein</button>
  </div>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Fruits, vegetables ya dono likho..."></textarea>
    <button id="sendBtn" type="button">Send</button>
  </div>
</div>

<script>
  // Vercel: api/gemini1.js  ->  /api/gemini1
  const API_URL = '/api/gemini1';

  const bodies = { LEFT: document.getElementById('bodyLeft'), RIGHT: document.getElementById('bodyRight') };
  const panels = { LEFT: document.getElementById('panelLeft'), RIGHT: document.getElementById('panelRight') };
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const errBox = document.getElementById('errBox');

  let history = [];          // Gemini "contents"
  let controller = null;     // abort controller
  let busy = false;

  /* ---------- helpers ---------- */
  const statusBox = document.getElementById('status');
  const ticks = { LEFT: new Set(), RIGHT: new Set() };   // ticked item keys per panel
  const seen = new Set();                                 // panels already refreshed in this response
  let statusTimer = null;

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function inline(s) {
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }
  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = msg ? 'block' : 'none';
  }
  function showStatus(msg, warn) {
    statusBox.textContent = msg;
    statusBox.classList.toggle('warn', !!warn);
    statusBox.style.display = 'block';
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { statusBox.style.display = 'none'; }, 3500);
  }

  /* ---------- item names / matching ---------- */
  const nameOf = s => s.replace(/\*\*/g, '').split(/\s[-\u2013\u2014]\s|\(|:/)[0].trim();
  const keyOf  = s => nameOf(s).toLowerCase();
  const baseOf = k => k.replace(/s$/, '');

  function allItems() {
    const out = [];
    ['LEFT', 'RIGHT'].forEach(p => {
      bodies[p].querySelectorAll('input[type=checkbox]').forEach(cb => {
        out.push({ panel: p, key: cb.dataset.key, name: nameOf(cb.parentNode.querySelector('span').textContent) });
      });
    });
    return out;
  }
  function resolve(name) {
    const k = keyOf(name);
    if (!k) return [];
    const items = allItems();
    let hit = items.filter(i => i.key === k);
    if (!hit.length) hit = items.filter(i => baseOf(i.key) === baseOf(k));
    if (!hit.length && k.length >= 3) hit = items.filter(i => i.key.includes(k) || (i.key.length >= 3 && k.includes(i.key)));
    return hit;
  }
  function syncChecks() {
    ['LEFT', 'RIGHT'].forEach(p => {
      bodies[p].querySelectorAll('input[type=checkbox]').forEach(cb => {
        const on = ticks[p].has(cb.dataset.key);
        cb.checked = on;
        cb.parentNode.classList.toggle('done', on);
      });
    });
  }
  function listState() {
    const items = allItems();
    const fmt = p => {
      const it = items.filter(i => i.panel === p);
      return it.length ? it.map(i => i.name + (ticks[p].has(i.key) ? ' [ticked]' : '')).join(', ') : '(empty)';
    };
    return `CURRENT LIST STATE\nLEFT (Fruits): ${fmt('LEFT')}\nRIGHT (Vegetables): ${fmt('RIGHT')}`;
  }

  /* ---------- tag parsers ----------
     Poore ab tak ke text par chalte hain, isliye adhe aaye tags safely handle hote hain. */
  function parsePanels(text) {
    const out = { LEFT: null, RIGHT: null, open: null };
    const re = /\[(LEFT|RIGHT)\]([\s\S]*?)(\[\/\1\]|$)/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const key = m[1];
      let body = m[2];
      if (!m[3]) {
        body = body.replace(/\[\/?[A-Za-z]*$/, '');
        out.open = key;
      }
      out[key] = (out[key] || '') + body;
    }
    return out;
  }
  // Sirf poore band hue [TICK]..[/TICK] / [UNTICK]..[/UNTICK] blocks (order mein)
  function parseTicks(text) {
    const cmds = [];
    const re = /\[(TICK|UNTICK)\]([\s\S]*?)\[\/\1\]/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const names = m[2].split(/[,\n]/).map(x => x.replace(/^[-*\u2022]\s*/, '').trim()).filter(Boolean);
      cmds.push({ type: m[1], names });
    }
    return cmds;
  }

  function applyTicks(cmds, isFinal) {
    const done = [], missing = [];
    cmds.forEach(c => c.names.forEach(n => {
      const hits = resolve(n);
      if (!hits.length) { if (isFinal) missing.push(n); return; }
      hits.forEach(h => { c.type === 'TICK' ? ticks[h.panel].add(h.key) : ticks[h.panel].delete(h.key); });
      if (isFinal) done.push((c.type === 'TICK' ? '\u2713 ' : '\u2717 ') + hits[0].name);
    }));
    syncChecks();
    if (isFinal) {
      if (done.length) showStatus(done.join('  '), false);
      if (missing.length) showStatus('List mein nahi mila: ' + missing.join(', '), true);
    }
  }

  /* ---------- render ---------- */
  function renderList(text) {
    return text.replace(/^\s+/, '').split('\n').map(line => {
      const t = line.trim();
      if (!t) return '';
      const m = t.match(/^[-*\u2022]\s+(.*)$/);
      if (m) {
        return `<label class="item"><input type="checkbox" data-key="${escapeHtml(keyOf(m[1]))}"><span>${inline(m[1])}</span></label>`;
      }
      return `<div class="plain">${inline(t)}</div>`;
    }).join('');
  }

  function render(fullText, isFinal) {
    const parsed = parsePanels(fullText);
    const cmds = parseTicks(fullText);
    const hasPanels = parsed.LEFT !== null || parsed.RIGHT !== null;

    if (hasPanels) {
      ['LEFT', 'RIGHT'].forEach(k => {
        if (parsed[k] !== null) {
          if (!seen.has(k)) { seen.add(k); ticks[k].clear(); }   // naya list -> purane ticks reset
          bodies[k].innerHTML = renderList(parsed[k]);
        }
        panels[k].classList.toggle('live', !isFinal && parsed.open === k);
      });
      if (parsed.open) bodies[parsed.open].scrollTop = bodies[parsed.open].scrollHeight;
    } else if (!cmds.length && isFinal && fullText.trim()) {
      // Model ne koi tag nahi diya -> LEFT mein dikhao
      bodies.LEFT.innerHTML = renderList(fullText);
    }

    if (cmds.length) applyTicks(cmds, isFinal); else syncChecks();
  }

  // Haath se tap karke bhi tick/untick
  ['LEFT', 'RIGHT'].forEach(p => {
    bodies[p].addEventListener('change', e => {
      const cb = e.target;
      if (!cb.matches || !cb.matches('input[type=checkbox]')) return;
      cb.checked ? ticks[p].add(cb.dataset.key) : ticks[p].delete(cb.dataset.key);
      syncChecks();
    });
  });

  /* ---------- SSE stream reader ---------- */
  function extractText(json) {
    const parts = json?.candidates?.[0]?.content?.parts;
    if (!Array.isArray(parts)) return '';
    return parts.map(p => p.text || '').join('');
  }

  async function streamReply(userText) {
    history.push({ role: 'user', parts: [{ text: userText }] });

    const now = new Date().toLocaleString('en-GB');
    const systemInstruction = {
      parts: [{ text: `User device time: ${now}. User location is Oman (GST, UTC+4).\n\n${listState()}` }]
    };

    controller = new AbortController();
    let full = '';
    seen.clear();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: history, systemInstruction }),
        signal: controller.signal
      });

      if (!res.ok) {
        let msg = `Error ${res.status}`;
        try { msg = (await res.json())?.error?.message || msg; } catch (_) {}
        throw new Error(msg);
      }

      // Naye jawab ke panels pehle reset honge jab unka tag aayega (replace, append nahi)
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let nl;
        while ((nl = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, nl).trim();
          buffer = buffer.slice(nl + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === '[DONE]') continue;
          try {
            const json = JSON.parse(payload);
            if (json.error) throw new Error(json.error.message || 'Stream error');
            const chunk = extractText(json);
            if (chunk) {
              full += chunk;
              render(full, false);
            }
          } catch (e) {
            if (e instanceof SyntaxError) continue;   // adhoora JSON, skip
            throw e;
          }
        }
      }

      render(full, true);
      if (!full.trim()) throw new Error('Empty response (safety filter ho sakta hai). Dobara try karo.');
      history.push({ role: 'model', parts: [{ text: full }] });

    } catch (err) {
      if (err.name === 'AbortError') {
        render(full, true);
        if (full.trim()) history.push({ role: 'model', parts: [{ text: full }] });
        else history.pop();
      } else {
        history.pop();               // fail hua user message wapas hatao
        showError(err.message);
      }
    } finally {
      Object.values(panels).forEach(p => p.classList.remove('live'));
    }
  }

  /* ---------- UI wiring ---------- */
  function setBusy(b) {
    busy = b;
    sendBtn.textContent = b ? 'Stop' : 'Send';
    sendBtn.classList.toggle('stop', b);
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    showError('');
    input.value = '';
    input.style.height = 'auto';

    // Sirf woh panel saaf hoga jiske liye naya jawab aayega - baaki panel jaisa hai waisa
    // (render() replace karta hai jab tag milta hai)
    setBusy(true);
    await streamReply(text);
    setBusy(false);
  }

  sendBtn.addEventListener('click', () => {
    if (busy) { controller && controller.abort(); return; }
    send(input.value);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });
  document.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => send(c.textContent))
  );
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (busy) controller && controller.abort();
    history = [];
    bodies.LEFT.innerHTML = '';
    bodies.RIGHT.innerHTML = '';
    ticks.LEFT.clear(); ticks.RIGHT.clear();
    showError('');
  });
</script>
</body>
</html>
